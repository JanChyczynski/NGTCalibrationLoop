# One run with one single-shot fault per target, each armed just before the work it is aimed at:
# OMS fails twice, the first upload fails and Step 2's cmsRun crashes on LS 2.
runs:
  - calibrations: [EcalPedestals]
    run: 900001
    start_offset: 0
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 20}
      - {ls: 3, after: 20}
    end_after: 30

faults:
  - {target: oms, mode: connection_error, run: 900001, at: 5, times: 2}
  - {target: upload_conditions, mode: exit_code, exit_code: 1, calibration: EcalPedestals, run: 900001, at: 10}
  - {target: cmsrun, mode: exit_code, exit_code: 139, calibration: EcalPedestals, run: 900001, step: step2, at: 15}

# LS 2 is lost: these loops never retry the Step 2 job the cmsRun fault crashes. Step 4 uploads
# the final payload again when the run ends.
expect:
  settle_timeout: 1200
  quiet_for: 120
  allow_duplicates: true
  allow_missing_lumisections: true
  allow_extra: {before: true, after: true}
  payloads:
    - {calibration: EcalPedestals, run: 900001, lumisections: 1-3}
