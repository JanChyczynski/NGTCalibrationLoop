# Demonstrates the `faults:` section (see scenario-player/faults.py and
# scenario-player/scenario_player.py's module docstring) against a single EcalPedestals
# run -- one fault per target (oms / cmsrun / upload_conditions), each armed
# at a different point on the same timeline used to seed runs/lumisections.
#
# Run number 400001 is deliberately unused by any other scenario-player/scenarios/*.yaml
# file, so this scenario's Airflow-UI/log output is never confused with
# another one's while both might be live-tested around the same time.
#
# What to expect while watching Airflow (task logs / UI) as this plays:
#   t=+5s   OMS connection errors twice (times: 2) -- daq_is_running/
#           last_ls_run_number fall back to their safe defaults (see
#           tests/test_oms_faults.py); find_new_run is unaffected (it never
#           filters by run_number, so this run-scoped fault can't match it).
#   t=+30s  OMS returns one HTTP 503 -- has NO visible effect on
#           daq_is_running/last_ls_run_number/run_end_time, since none of
#           them call raise_for_status(); documents that existing gap live.
#   t=+45s  step2's cmsRun crashes once (exit 139, a segfault-style code) for
#           this run specifically -- launch_job's retry policy (3 retries,
#           2min exponential backoff, see airflow_automation/airflow_dags/_process_tasks.py's
#           LAUNCH_RETRY_KWARGS) should retry and succeed on the next attempt.
#   t=+150s upload_conditions.py returns exit code 1 once -- step4_upload's
#           independent retry policy (5 retries, 1min backoff) should retry
#           and succeed, without re-running the harvesting job.
#
# Play with (against a live `airflow_automation/airflow_demo/airflow_demo.sh setup && start`, per
# README.md -- e.g. with only ngt_watch_* unpaused):
#   python3 scenario-player/scenario_player.py scenario-player/scenarios/fault_injection_demo.yaml --dry-run
#   python3 scenario-player/scenario_player.py scenario-player/scenarios/fault_injection_demo.yaml
runs:
  - calibrations: [EcalPedestals, SiStripBad]
    run: 400001
    start_offset: 0
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 15}
      - {ls: 3, after: 15}
    end_after: 20  

faults:
  - target: cmsrun
    mode: exit_code
    exit_code: 139
    calibration: EcalPedestals
    run: 400001
    step: step2
    at: 40
    times: 6

  - target: upload_conditions
    mode: exit_code
    exit_code: 1
    calibration: EcalPedestals
    run: 400001
    at: 25
    times: 6

# What this scenario can assert, and what it deliberately cannot.
#
# Both faults are scoped to EcalPedestals, and scope matching is by working
# directory (scenario-player/bin/cmsRun's _scope_from_cwd), so SiStripBad is
# untouched and must still finish with a payload covering exactly LS 1-3.
# That is the real assertion here: one calibration failing hard must not take
# a concurrent, unrelated one down with it.
#
# EcalPedestals' own outcome is NOT asserted, hence allow_extra.payloads --
# it is genuinely nondeterministic rather than merely unknown. `times: 6`
# bounds how many calls each fault survives, not how long it stays armed, and
# Step 4 re-harvests on every cycle, so each cycle brings a *fresh* retry
# budget: once those 6 upload calls are used up, a later cycle's upload
# succeeds. Whether that happens before playback ends, and how much of LS 1-3
# the payload then covers, depends on Airflow's scheduling. Asserting any one
# of those outcomes would make this scenario flake rather than check anything.
expect:
  settle_timeout: 1200
  quiet_for: 120
  allow_extra: {before: true, payloads: true}
  payloads:
    - {calibration: SiStripBad, run: 400001, lumisections: 1-3}
