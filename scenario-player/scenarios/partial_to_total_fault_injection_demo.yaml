# Two runs back to back. The first gets single-shot faults, as in fault_injection_demo.yaml; the
# second the same upload and cmsRun faults again, each up to six times.
runs:
  - calibrations: [EcalPedestals]
    run: 900011
    start_offset: 0
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 20}
      - {ls: 3, after: 20}
    end_after: 30
  - calibrations: [EcalPedestals]
    run: 900012
    start_offset: 90
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 15}
      - {ls: 3, after: 15}
    end_after: 20

faults:
  - {target: oms, mode: connection_error, run: 900011, at: 5, times: 2}
  - {target: upload_conditions, mode: exit_code, exit_code: 1, calibration: EcalPedestals, run: 900011, at: 10}
  - {target: cmsrun, mode: exit_code, exit_code: 139, calibration: EcalPedestals, run: 900011, step: step2, at: 15}
  - {target: oms, mode: http_error, status: 503, at: 30}
  - {target: upload_conditions, mode: exit_code, exit_code: 1, calibration: EcalPedestals, run: 900012, at: 95, times: 6}
  - {target: cmsrun, mode: exit_code, exit_code: 139, calibration: EcalPedestals, run: 900012, step: step2, at: 100, times: 6}
