# Single run, single calibration.
runs:
  - calibrations: [EcalPedestals]
    run: 398600
    start_offset: 0
    minutes_ago: 2
    lumisections:
      - {ls: 51, after: 0}
      - {ls: 52, after: 20}
      - {ls: 53, after: 20}
    end_after: 30

# The run must end with one payload covering exactly LS 51-53.
#
# `before: true` tolerates the intermediate uploads on the way there: Step 4
# re-harvests everything available on each cycle rather than just the new
# delta (ngt_calibration_loop/step4.py's check_files_for_processing), so a
# healthy run climbs through growing payloads -- {51}, {51,52}, {51,52,53} --
# and exactly how many of those land depends on when Step 3's outputs appear
# relative to Step 4's polling.
#
# TODO: loose check, needs more attention. `after: false` (the default) would fail
# the scenario if anything is uploaded once that final payload is in -- which is
# what catches a DAG re-firing on a coalesced asset event after the run ended --
# but it is switched off here, with `allow_duplicates`, only because the FSM loops
# (live_demo.sh play) upload the final payload once more when the run ends. So this
# block currently lets those regressions through, along with any other repeated
# upload. See README.md's "Validating the result".
expect:
  settle_timeout: 600
  quiet_for: 45
  allow_duplicates: true
  allow_extra: {before: true, after: true}
  payloads:
    - {calibration: EcalPedestals, run: 398600, lumisections: 51-53}
