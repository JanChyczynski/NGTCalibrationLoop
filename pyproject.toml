[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngt-calibration-loop"
version = "0.1.0"
description = "NGT calibration loop processing logic, shared by pytest and the Airflow DAGs in airflow_automation/airflow_dags/."
requires-python = ">=3.8"
dependencies = [
    "PyYAML==6.0.3",
    # Split pin, as in requirements.txt: newer requests dropped Python 3.8/3.9.
    "requests==2.32.4; python_version<'3.10'",
    "requests==2.34.2; python_version>='3.10'",
]

[tool.setuptools.packages.find]
include = ["ngt_calibration_loop*"]
